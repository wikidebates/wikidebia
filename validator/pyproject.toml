[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikidebia-validator"
version = "0.4.46"
description = "Validateur local stable des paquets Wikidéb'IA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18", "referencing>=0.30"]
license = {text = "MIT"}
authors = [{name = "Wikidéb'IA"}]

[project.scripts]
wikidebia-validate = "wikidebia_validator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
wikidebia_validator = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
